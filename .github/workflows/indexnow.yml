name: IndexNow
# Vercel reports each deploy back to GitHub. When a production deploy succeeds,
# ping IndexNow so Bing (and the engines it shares with) recrawl the live pages.
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
